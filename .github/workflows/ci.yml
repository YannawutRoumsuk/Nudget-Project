name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest

    # Membership and the member list are SQL. Without a real database here the
    # integration tests skip themselves and those queries ship unverified.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: spendbot
          POSTGRES_PASSWORD: spendbot
          POSTGRES_DB: nudget_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U spendbot -d nudget_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      TEST_DATABASE_URL: postgres://spendbot:spendbot@localhost:5432/nudget_test

    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11
      - run: bun install --frozen-lockfile
      - run: bun run check
      - name: Apply migrations to the test database
        run: bun run db:migrate
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
      - run: bun run test:run
      - run: bun run build
      - run: docker build -t nudget:${{ github.sha }} .
      - name: Build the PostgreSQL backup image
        run: docker build -f ops/postgres-backup/Dockerfile -t nudget-backup:${{ github.sha }} .
      - name: Verify a logical backup can be restored
        run: |
          mkdir -p "${RUNNER_TEMP}/nudget-backup"
          docker run --rm --network host \
            -e DATABASE_URL="${TEST_DATABASE_URL}" \
            -e BACKUP_LOCAL_DIR=/backup \
            -e BACKUP_RETENTION_DAYS=30 \
            -v "${RUNNER_TEMP}/nudget-backup:/backup" \
            nudget-backup:${{ github.sha }}
          docker run --rm --network host \
            -e PGPASSWORD=spendbot \
            postgres:18-alpine \
            psql -h 127.0.0.1 -U spendbot -d postgres -v ON_ERROR_STOP=1 \
            -c 'CREATE DATABASE nudget_restore_test'
          docker run --rm --network host \
            -e DATABASE_URL="${TEST_DATABASE_URL}" \
            -e RESTORE_DATABASE_URL=postgres://spendbot:spendbot@127.0.0.1:5432/nudget_restore_test \
            -e BACKUP_LOCAL_DIR=/backup \
            -e ALLOW_RESTORE_CHECK=1 \
            -v "${RUNNER_TEMP}/nudget-backup:/backup" \
            nudget-backup:${{ github.sha }} \
            /app/scripts/verify-postgres-backup.sh
